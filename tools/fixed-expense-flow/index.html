<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIBoot 연결현황</title>
<style>
  :root { --bg:#f6f7f8; --panel:#fff; --line:#dfe3e7; --text:#1d2329; --sub:#5b6570; --ok:#1b7f4b; --check:#b4410e; --un:#5b6570; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 "Malgun Gothic","Apple SD Gothic Neo",sans-serif; }
  main { max-width:960px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:16px 0; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .stat b { display:block; font-size:24px; line-height:1.2; }
  .stat.check b { color:var(--check); } .stat.ok b { color:var(--ok); }
  .warn { background:#fff4ec; border:1px solid #f0c9ae; border-radius:8px; padding:10px 12px; margin:12px 0; font-size:14px; }
  ul.tree, ul.tree ul { list-style:none; margin:0; padding:0; }
  ul.tree { margin-top:12px; }
  ul.tree ul { margin-left:12px; padding-left:12px; border-left:1px solid var(--line); }
  .node { font-weight:700; padding:6px 0; }
  details.v { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin:6px 0; }
  details.v[open] { border-color:#aeb6bf; }
  summary { display:grid; grid-template-columns:minmax(120px,170px) 86px 78px 1fr; gap:10px; align-items:start; padding:9px 12px; cursor:pointer; list-style:none; }
  summary::-webkit-details-marker { display:none; }
  .name { font-weight:700; }
  .badge { font-size:13px; font-weight:700; }
  .정상 { color:var(--ok); } .확인 { color:var(--check); } .미검증 { color:var(--un); }
  .why { color:var(--sub); font-size:14px; }
  .col { font-size:13px; color:var(--sub); }
  dl { margin:0; padding:2px 12px 12px; display:grid; grid-template-columns:110px 1fr; gap:4px 12px; font-size:14px; border-top:1px solid var(--line); }
  dt { color:var(--sub); padding-top:6px; } dd { margin:0; padding-top:6px; }
  .inactive { color:var(--sub); font-size:13px; margin:10px 0 0; }
  @media (max-width:640px) {
    .stats { grid-template-columns:repeat(2,1fr); }
    summary { grid-template-columns:1fr auto; }
    summary .col, summary .why { grid-column:1 / -1; }
  }
</style>
</head>
<body>
<main id="app"></main>
<script src="evidence.local.js"></script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const when = iso => iso ? new Intl.DateTimeFormat('ko-KR', { timeZone: 'Asia/Seoul', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date(iso)) : '-';
const cls = s => s.split(' ')[0];
const SLOT = { morning: '오전', afternoon: '오후' };
const app = document.getElementById('app');
const e = window.AIBOOT_EVIDENCE;

// 확인 필요를 맨 위로, 같은 상태끼리는 원본 행 순서.
const RANK = { '확인 필요': 0, '미검증': 1, '정상': 2 };
const byUrgency = (a, b) => RANK[a.status] - RANK[b.status] || a.row - b.row;

function vendor(i) {
  const rows = [['원본 연결', `${i.source.state} — ${i.source.text}`], ['대상 회차', i.target || '-'], ['사용기간', i.period], ['납부 기준', i.basisRule],
    ['청구서 경로', i.path], ['실제 점검시각', when(i.checkedAt)], ['판정 이유', i.reason], ...(i.notes || []).map(n => ['참고', n])];
  return `<li><details class="v"><summary>
    <span class="name">${esc(i.vendor)}</span>
    <span class="col">원본 ${esc(i.source.state)}</span>
    <span class="badge ${cls(i.status)}">${esc(i.status)}</span>
    <span class="why"><b>${esc(i.report)}</b> · ${esc(i.reason)}</span>
  </summary><dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details></li>`;
}

if (!e || !e.domains) {
  app.innerHTML = `<h1>AIBoot 연결현황</h1><div class="warn">점검 결과 파일이 없어 모든 업체가 <b>미검증</b>입니다. 이 폴더에서 <code>node build-evidence.mjs</code>를 실행한 뒤 새로 고치세요.</div>`;
} else {
  const d = e.domains[0], s = d.summary;
  const warnings = [...d.warnings, ...(e.scheduleError ? [e.scheduleError] : []),
    ...e.checks.filter(c => !c.ok).map(c => `실행기 코드 확인 실패: ${c.label}`),
    ...e.errors.filter(x => e.report && x.key.startsWith(`${e.report.date}|${e.report.slot}|`) && !x.key.includes('|test')).map(x => `기준 보고에 ${x.key.split('|')[2]} 실패 기록이 있음(${when(x.at)})`)];
  app.innerHTML = `
    <h1>AIBoot 연결현황</h1>
    <div class="sub">고정비가 보고에 없을 때 정상 제외인지 누락 의심인지 확인합니다. 판정 기준 코드: ${esc(e.repo.branch)}</div>
    <div class="stats">
      <div class="stat"><b>${s.total}</b>관리대상</div>
      <div class="stat ok"><b>${s.ok}</b>정상</div>
      <div class="stat check"><b>${s.check}</b>확인 필요</div>
      <div class="stat"><b>${s.unverified}</b>미검증</div>
    </div>
    <div class="sub">최근 점검 ${when(e.generatedAt)} · 기준 보고 ${e.report ? `${esc(e.report.date)} ${SLOT[e.report.slot]} (${esc(e.report.agents.join('·'))})` : '없음'} · 점검 창 ~${esc(d.windowEnd.slice(5).replace('-', '/'))}</div>
    ${warnings.length ? `<div class="warn">${warnings.map(esc).join('<br>')}</div>` : ''}
    <ul class="tree"><li><div class="node">AIBoot</div><ul>
      ${e.domains.map(x => `<li><div class="node">${esc(x.name)} (${x.items.length}개)</div><ul>${[...x.items].sort(byUrgency).map(vendor).join('')}</ul></li>`).join('')}
    </ul></li></ul>
    ${d.inactive.length ? `<p class="inactive">비활성 이력(관리대상 제외): ${d.inactive.map(esc).join(', ')}</p>` : ''}`;
}
</script>
</body>
</html>
